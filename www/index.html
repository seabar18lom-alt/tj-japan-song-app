rows.sort((x,y)=>sort==='title'?x.ko.localeCompare(y.ko,'ko'):sort==='number'?x.number.localeCompare(y.number,undefined,{numeric:true}):sort==='artist'?(x.artist||'힣').localeCompare(y.artist||'힣','ko')||x.ko.localeCompare(y.ko,'ko'):(rank[x.genre]??9)-(rank[y.genre]??9)||x.ko.localeCompare(y.ko,'ko'));

for(const id of ['query','genre','artist','sort','ostType'])$(id).addEventListener('input',render);

const dialog=$('songDialog');
function openModal(s){$('songForm').reset();$('editId').value=s?s.id:'';$('dialogTitle').textContent=s?'내 노래 수정':'내 노래 추가';if(s){$('fKo').value=s.ko;$('fJp').value=s.jp||'';$('fArtist').value=s.artist||'';$('fCovers').value=(s.covers||[]).join(', ');$('fGenre').value=s.genre||'J-POP';$('fNumber').value=s.number||''}dialog.showModal()}
$('addBtn').onclick=()=>openModal(null);$('dialogCancel').onclick=()=>dialog.close();
function idState(){const next={};for(const s of songs)next[s.id]=Boolean(s.favorite);return next}
$('songForm').onsubmit=e=>{e.preventDefault();const id=$('editId').value,ko=$('fKo').value.trim(),number=$('fNumber').value.trim();if(!ko||!/^\d{1,10}$/.test(number)){alert('제목과 숫자 TJ 번호를 입력해 줘.');return}

const next=customSongs.map(s=>({...s})),ids=idState();
const data={ko,number,jp:$('fJp').value.trim(),artist:$('fArtist').value.trim(),covers:$('fCovers').value.split(',').map(x=>x.trim()).filter(Boolean),genre:$('fGenre').value};
if(id){const i=next.findIndex(s=>s.id===id);if(i<0)return;next[i]={...next[i],...data}}
else{const s={...data,id:makeId(),isCustom:true};next.unshift(s);ids[s.id]=true}
if(transact(next,ids)){dialog.close();render();toast('저장했어.')}}
async function copyNumber(v){try{await navigator.clipboard.writeText(v);toast('TJ '+v+' 복사됨');return}catch{}const ta=document.createElement('textarea');ta.value=v;document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(ok)toast('TJ '+v+' 복사됨');else window.prompt('TJ 번호 복사',v)}
$('tbody').onclick=e=>{const el=e.target.closest('[data-act]');if(!el)return;const s=songs.find(x=>x.id===el.dataset.id);if(!s)return;const act=el.dataset.act;if(act==='copy')return copyNumber(s.number);
if(act==='album'){window.open(albumSearchUrl(s),'_blank','noopener,noreferrer');return}

if(act==='fav'){const ids=idState();ids[s.id]=!s.favorite;if(transact(customSongs,ids)){render();toast(ids[s.id]?'즐겨찾기 추가':'즐겨찾기 해제')}}};
async function download(name,content){
  const cap=window.Capacitor;
  const filesystem=cap&&cap.Plugins&&cap.Plugins.Filesystem;
  const share=cap&&cap.Plugins&&cap.Plugins.Share;
  if(cap&&cap.isNativePlatform&&cap.isNativePlatform()){
    if(!filesystem||!share){alert('백업 저장 기능이 준비되지 않았어. 앱을 최신 버전으로 업데이트해 줘.');return}
    try{
      const bytes=new TextEncoder().encode(content);
      let binary='';
      for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));
      await filesystem.writeFile({path:name,data:btoa(binary),directory:'CACHE'});
      const file=await filesystem.getUri({path:name,directory:'CACHE'});
      await share.share({title:'TJ 즐겨찾기 백업',files:[file.uri],dialogTitle:'백업 JSON 파일 저장 또는 공유'});
      toast('공유 화면에서 파일을 저장해 줘.');
    }catch(err){
      console.error('Backup export failed:',err);
      alert('백업 파일 공유에 실패했어. 파일은 아직 외부에 저장되지 않았을 수 있어. 다른 저장 앱을 선택하거나 다시 시도해 줘.');
    }
    return;
  }
  try{
    const blob=new Blob([content],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    toast('백업 다운로드를 시작했어.');
  }catch(err){console.error(err);alert('백업 다운로드에 실패했어.')}
}
$('export').onclick=()=>download('TJ_즐겨찾기_백업.json',JSON.stringify({version:7,exportedAt:new Date().toISOString(),favorites:legacyList(),favoriteIds:idState(),customSongs},null,2));
const restoreDialog=$('restoreDialog');
function chooseRestoreMode(){
  return new Promise(resolve=>{
    const done=mode=>{restoreDialog.close();restoreDialog.removeEventListener('cancel',onCancel);resolve(mode)};
    const onCancel=e=>{e.preventDefault();done(null)};
    $('restoreMerge').onclick=()=>done('merge');
    $('restoreFull').onclick=()=>done('full');
    $('restoreCancel').onclick=()=>done(null);
    restoreDialog.addEventListener('cancel',onCancel);
    restoreDialog.showModal();
  });
}
$('importBtn').onclick=()=>{$('importFile').value='';$('importFile').click()};
$('importFile').onchange=e=>{const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=async()=>{
let data;try{data=JSON.parse(reader.result)}catch{alert('올바른 JSON이 아니야.');return}
const oldFormat=Array.isArray(data),valid=oldFormat||data&&typeof data==='object'&&Array.isArray(data.favorites);if(!valid){alert('백업 형식이 올바르지 않아.');return}
const oldFav=oldFormat?data:data.favorites;if(!oldFav.every(x=>typeof x==='string')){alert('즐겨찾기 데이터 형식 오류');return}
const mode=await chooseRestoreMode();if(!mode)return;
if(mode==='full'&&!confirm('전체 복원은 현재 즐겨찾기를 덮어써. 진행할까?'))return;
const full=mode==='full',incoming=Array.isArray(data.customSongs)?data.customSongs:null;
if(full&&incoming&&!confirm('백업 파일의 사용자 추가곡 목록으로 교체할까? (현재 추가곡이 사라질 수 있어)'))return;
const next=full&&incoming?[]:customSongs.map(s=>({...s})),taken=new Set([...baseIds,...next.map(s=>s.id)]);
for(const raw of incoming||[]){const clean=cleanCustom(raw);if(!clean)continue;if(next.some(s=>s.number===clean.number||norm(s.ko)===norm(clean.ko)))continue;while(taken.has(clean.id))clean.id=makeId();taken.add(clean.id);next.push(clean)}
const ids=full?{}:idState();const idBackup=data&&typeof data.favoriteIds==='object'&&!Array.isArray(data.favoriteIds)?data.favoriteIds:null;
for(const s of [...INITIAL,...next]){if(idBackup&&typeof idBackup[s.id]==='boolean'){ids[s.id]=full?idBackup[s.id]:Boolean(ids[s.id]||idBackup[s.id])}
else if(oldFav.includes(s.ko)||(s.oldKo&&oldFav.includes(s.oldKo)))ids[s.id]=true;else if(full)ids[s.id]=false}
if(transact(next,ids)){render();toast('백업 복원 완료')}};reader.readAsText(file)};
render();
</script></body></html>
