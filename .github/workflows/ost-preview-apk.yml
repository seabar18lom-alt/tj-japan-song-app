name: OST Preview APK (separate app)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ost-artwork-20261021
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug preview
        run: |
          npm install --no-audit --no-fund
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('capacitor.config.json')
          d=json.loads(p.read_text())
          d['appId']='com.hayeon.tjjpsong.ostpreview'
          d['appName']='TJ 노래방 OST 테스트'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2))
          PY
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tj-ost-preview-separate-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
