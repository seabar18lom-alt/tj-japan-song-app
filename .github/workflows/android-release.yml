name: Android APK Build & Obtainium Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK build type'
        type: choice
        required: true
        default: debug
        options:
          - debug
          - release

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Capacitor and create Android project
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Configure APK version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          code = int(os.environ['RUN_NUMBER'])
          name = os.environ['REF_NAME'][1:] if os.environ['REF_TYPE'] == 'tag' else f"1.0.{code}"
          if not re.fullmatch(r'[0-9]+(?:\.[0-9]+){0,3}', name):
              raise SystemExit(f'Invalid version for Android: {name}')
          path = Path('android/app/build.gradle')
          text = path.read_text()
          text, n1 = re.subn(r'\bversionCode\s+\d+', f'versionCode {code}', text, count=1)
          text, n2 = re.subn(r'\bversionName\s+["\'][^"\']+["\']', f'versionName "{name}"', text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('Gradle version fields not found; review generated Android project')
          path.write_text(text)
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'VERSION_CODE={code}\nVERSION_NAME={name}\n')
          PY

      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.build_type == 'debug') }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk "../tj-jpsong-v${{ env.VERSION_NAME }}-debug.apk"

      - name: Upload debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.build_type == 'debug') }}
        uses: actions/upload-artifact@v4
        with:
          name: tj-jpsong-debug-${{ github.run_number }}
          path: tj-jpsong-*-debug.apk
          if-no-files-found: error

      - name: Build signed release APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.build_type == 'release' }}
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing GitHub Actions secret: $key"
              exit 1
            fi
          done
          trap 'rm -f release-key.jks' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release-key.jks
          chmod +x gradlew
          ./gradlew assembleRelease \
            "-Pandroid.injected.signing.store.file=$(pwd)/release-key.jks" \
            "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"
          mv app/build/outputs/apk/release/app-release.apk "../tj-jpsong-v${{ env.VERSION_NAME }}-release.apk"

      - name: Publish signed release for Obtainium
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.build_type == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: v${{ env.VERSION_NAME }}
          generate_release_notes: true
          files: tj-jpsong-v${{ env.VERSION_NAME }}-release.apk
          fail_on_unmatched_files: true
