name: Android APK Build & Obtainium Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: '빌드 종류 선택 (release: 정식 서명 및 릴리즈 / debug: 개발용)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js & Java 17
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Install Dependencies & Generate Android Project
        run: |
          npm install
          npx cap add android
          npx cap copy android

      - name: 4. Set Fixed applicationId, auto versionCode & versionName
        run: |
          VERSION_CODE=${{ github.run_number }}
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME=${GITHUB_REF#refs/tags/v}
          else
            VERSION_NAME="1.0.${{ github.run_number }}"
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

          sed -i "s/versionCode 1/versionCode $VERSION_CODE/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION_NAME\"/g" android/app/build.gradle

      - name: 5. Build Debug APK (개발용)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v') && github.event.inputs.build_type != 'release'
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk ../tj-jpsong-${{ env.VERSION_NAME }}-debug.apk

      - name: 6. Upload Debug APK Artifact
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v') && github.event.inputs.build_type != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: tj-jpsong-*-debug.apk

      - name: 7. Decode Keystore & Build Signed Release APK (정식 업데이트용)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_type == 'release'
        working-directory: ./android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release-key.jks
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release-key.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          mv app/build/outputs/apk/release/app-release.apk ../tj-jpsong-v${{ env.VERSION_NAME }}-release.apk
          rm -f release-key.jks

      - name: 8. Publish to GitHub Releases (Obtainium 연동)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_type == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: "v${{ env.VERSION_NAME }} 정식 업데이트 (Build #${{ env.VERSION_CODE }})"
          body: |
            - Obtainium 자동 업데이트 호환 정식 서명 APK
            - 패키지명(applicationId): `com.hayeon.tjjpsong` (기존 즐겨찾기 유지)
            - 오프라인 모드 지원
          files: tj-jpsong-v${{ env.VERSION_NAME }}-release.apk
